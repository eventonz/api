name: Deploy to Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /root/node-api
            git pull origin main
            npm install --production

            # Pin PG_HOST to the current managed-DB host (was pointing at a
            # decommissioned droplet). Host is not secret; password is.
            PG_HOST_CURRENT='db-postgresql-3-may-2026-do-user-3724083-0.j.db.ondigitalocean.com'
            if grep -q '^PG_HOST=' .env; then
              sed -i "s|^PG_HOST=.*|PG_HOST=${PG_HOST_CURRENT}|" .env
            else
              echo "PG_HOST=${PG_HOST_CURRENT}" >> .env
            fi

            pm2 restart evento-api --update-env
            echo "✅ Deployment complete"
