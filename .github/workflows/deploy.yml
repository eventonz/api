name: Deploy to Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /root/node-api
            git pull origin main
            npm install --production

            # Pin PG_HOST + REDIS_HOST to current managed-DB hosts (old ones
            # were decommissioned). Hosts are not secret; passwords are.
            PG_HOST_CURRENT='db-postgresql-3-may-2026-do-user-3724083-0.j.db.ondigitalocean.com'
            REDIS_HOST_CURRENT='db-valkey-syd1-09683-do-user-3724083-0.j.db.ondigitalocean.com'
            if grep -q '^PG_HOST=' .env; then
              sed -i "s|^PG_HOST=.*|PG_HOST=${PG_HOST_CURRENT}|" .env
            else
              echo "PG_HOST=${PG_HOST_CURRENT}" >> .env
            fi
            if grep -q '^REDIS_HOST=' .env; then
              sed -i "s|^REDIS_HOST=.*|REDIS_HOST=${REDIS_HOST_CURRENT}|" .env
            else
              echo "REDIS_HOST=${REDIS_HOST_CURRENT}" >> .env
            fi

            # Apply ecosystem.config.js (graceful reload): picks up instance-count
            # changes and starts BOTH evento-api (2 cluster workers) and
            # evento-track-worker. Plain `pm2 restart` did neither.
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
            pm2 status
            echo "✅ Deployment complete"
